# Proyecto de Xcode de iOS con dos apps: RutaKids (la app real, con el menú) y
# RutaKidsSpike (la prueba técnica del puente). Se genera en la Mac con:
#   brew install xcodegen && xcodegen generate
name: RutaKids
options:
  bundleIdPrefix: org.fundacionado.rutakids
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftGodotKit:
    url: https://github.com/migueldeicaza/SwiftGodotKit
    branch: swiftgodotkit-4.7
targets:
  RutaKids:
    type: application
    platform: iOS
    sources:
      - path: RutaKids
        excludes:
          - "main.pck"
      - path: RutaKids/main.pck
        buildPhase: resources
      # Imágenes del menú (fondo, botón de regreso, tarjetas de niveles).
      - path: "ASSETS de menu de IOS"
    dependencies:
      - package: SwiftGodotKit
        product: SwiftGodotKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.fundacionado.rutakids
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RutaKids
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Poner aquí el Team ID de la cuenta de Apple de quien compile (o elegirlo en Xcode).
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
  RutaKidsSpike:
    type: application
    platform: iOS
    sources:
      - path: RutaKidsSpike
        excludes:
          - "main.pck"
      - path: RutaKidsSpike/main.pck
        buildPhase: resources
    dependencies:
      - package: SwiftGodotKit
        product: SwiftGodotKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.fundacionado.rutakids.spike
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RutaKids spike
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Poner aquí el Team ID de la cuenta de Apple de quien compile (o elegirlo en Xcode).
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
